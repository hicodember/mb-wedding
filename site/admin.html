<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wedding Dashboard</title>
<link rel="icon" href="images/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=Mrs+Saint+Delafield&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',sans-serif;color:#1F1A16;background:#fff;-webkit-font-smoothing:antialiased}
a{color:#B4532A}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid #EAE4DA;background:#fff}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid #E5DED3;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1F1A16}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand .s{font-family:'Mrs Saint Delafield',cursive;font-weight:400;font-size:30px;color:#B4532A;line-height:1}
.crumb{color:#6B5E52;font-size:14px}
.crumb b{color:#1F1A16}
.who{margin-left:auto;font-size:13px;color:#6B5E52;display:flex;gap:10px;align-items:center}
.drawer-bg{position:fixed;inset:0;background:rgba(31,26,22,.35);z-index:40;display:none}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:#fff;z-index:41;transform:translateX(-100%);transition:transform .25s ease;padding:16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid #EAE4DA}
.drawer.open{transform:none}.drawer-bg.open{display:block}
.drawer a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:10px;color:#1F1A16;text-decoration:none;font-weight:600;font-size:15px}
.drawer a:hover,.drawer a.on{background:#F7F2EB}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid #EAE4DA;overflow-x:auto}
.tabs a{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;color:#6B5E52;text-decoration:none;font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:#1F1A16;border-bottom-color:#B4532A}
.tabs a .n{font-size:12px;background:#F2ECE3;border-radius:10px;padding:2px 8px;color:#1F1A16}
.wrap{display:flex;gap:24px;padding:24px 16px 60px;max-width:1240px;margin:0 auto;flex-wrap:wrap}
.main{flex:999 1 560px;min-width:0}
.side{flex:1 1 280px;max-width:100%;display:flex;flex-direction:column;gap:16px}
h1{font-family:'Cormorant Garamond',serif;font-size:34px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
p.sub{margin:0 0 20px;color:#6B5E52;font-size:14px}
.box{border:1px solid #EAE4DA;border-radius:14px;padding:18px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{border:1px solid #EAE4DA;border-radius:14px;padding:16px}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:38px;line-height:1;color:#B4532A}
.stat span{font-size:13px;color:#6B5E52;font-weight:600}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid #1F1A16;background:#1F1A16;color:#fff;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.light{background:#fff;color:#1F1A16;border-color:#D9D0C3}
.btn.accent{background:#B4532A;border-color:#B4532A}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tbl-wrap{overflow-x:auto;border:1px solid #EAE4DA;border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #F0EAE1;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#6B5E52;background:#FBF8F4}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px}
.yes{background:#E6F4EC;color:#1E6B42}.no{background:#F4E9E6;color:#8A3B1A}.pend{background:#F2ECE3;color:#6B5E52}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{position:relative;border-radius:12px;overflow:hidden;background:#F2ECE3;aspect-ratio:1}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .bar{position:absolute;left:0;right:0;bottom:0;padding:8px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:12px;font-weight:600}
.ph button{height:30px;padding:0 10px;border-radius:8px;border:none;background:#fff;color:#1F1A16;font-size:12px;font-weight:700;cursor:pointer}
.ph.hidden img{opacity:.3}
.tag{position:absolute;top:8px;left:8px;background:#fff;color:#1F1A16;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
label.f{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input.in,textarea.in{width:100%;height:44px;border-radius:10px;border:1px solid #D9D0C3;padding:0 12px;font-family:inherit;font-size:15px}
textarea.in{height:140px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:13px}
.muted{color:#6B5E52}
.login{max-width:420px;margin:80px auto;padding:0 20px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F1A16;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;display:none;z-index:60}
.wish{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid #F0EAE1}
.wish video{width:200px;border-radius:12px;background:#000}
@media(max-width:560px){.wish{grid-template-columns:1fr}.wish video{width:100%}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="login" class="login" style="display:none">
<div style="font-family:'Mrs Saint Delafield',cursive;font-size:58px;color:#B4532A;line-height:1">Mackenzie &amp; Brandon</div>
<h1 style="margin-top:6px">Wedding dashboard</h1>
<p class="muted">Enter your email and we will send you a sign-in link.</p>
<form id="loginForm"><label for="email" class="sr">Email</label><input id="email" class="in" type="email" required placeholder="you@example.com" autocomplete="email"><button class="btn accent" type="submit" style="width:100%;justify-content:center;margin-top:10px;height:48px">Send my sign-in link</button></form>
<p id="loginMsg" class="muted" style="margin-top:16px"></p>
</div>

<div id="app" style="display:none">
<div class="top">
<button class="icon-btn" id="menuBtn" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
<div class="brand"><span class="s">M&amp;B</span><span class="crumb">Wedding / <b id="crumb">Overview</b></span></div>
<div class="who"><span id="whoEmail"></span><button class="btn light" id="signOut" style="height:34px">Sign out</button></div>
</div>
<div class="drawer-bg" id="drawerBg"></div>
<nav class="drawer" id="drawer" aria-label="Menu"></nav>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="wrap"><main class="main" id="main"></main><aside class="side" id="side"></aside></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
var C = window.CFG || {};
var $ = function (s) { return document.querySelector(s); };
function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(m) { var t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 3000); }
if (!C.supabaseUrl || !window.supabase) { document.body.innerHTML = '<div class="login"><h1>Almost ready</h1><p class="muted">Add your Supabase URL and key to config.js first.</p></div>'; return; }
var sb = supabase.createClient(C.supabaseUrl, C.supabaseAnonKey);
var ICON = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  rsvp: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  guests: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 14.5c3 0 6 2 6 5.5"/>',
  photos: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  wishes: '<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
  gifts: '<path d="M12 21c-5-3-8-6-8-10a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 4-3 7-8 10z"/>',
  quiz: '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
function ic(k) { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[k] + '</svg>'; }
var TABS = [['overview', 'Overview', 'home'], ['rsvps', 'RSVPs', 'rsvp'], ['guests', 'Guest list', 'guests'], ['photos', 'Photos', 'photos'], ['wishes', 'Video wishes', 'wishes'], ['gifts', 'Honeymoon fund', 'gifts'], ['quiz', 'Quiz', 'quiz'], ['settings', 'Settings', 'settings']];
var counts = {};

// ---------- auth ----------
$('#loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var email = $('#email').value.trim();
  sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } }).then(function (r) {
    $('#loginMsg').textContent = r.error ? 'That did not work: ' + r.error.message : 'Check your email for the sign-in link.';
  });
});
$('#signOut').addEventListener('click', function () { sb.auth.signOut().then(function () { location.reload(); }); });
sb.auth.getSession().then(function (r) { start(r.data.session); });
sb.auth.onAuthStateChange(function (ev, session) { if (ev === 'SIGNED_IN') start(session); });
var started = false;
function start(session) {
  if (!session) { $('#login').style.display = 'block'; return; }
  if (started) return; started = true;
  sb.rpc('is_admin').then(function (r) {
    if (!r.data) { $('#login').style.display = 'block'; $('#loginForm').style.display = 'none'; $('#loginMsg').innerHTML = 'Signed in as ' + esc(session.user.email) + ', but this email is not on the admin list. <a href="#" id="so">Sign out</a>'; $('#so').onclick = function () { sb.auth.signOut().then(function () { location.reload(); }); }; return; }
    $('#login').style.display = 'none'; $('#app').style.display = 'block'; $('#whoEmail').textContent = session.user.email;
    window.addEventListener('hashchange', route); route();
  });
}

// ---------- layout ----------
function nav(cur) {
  var html = TABS.map(function (t) { return '<a href="#' + t[0] + '" class="' + (t[0] === cur ? 'on' : '') + '">' + ic(t[2]) + t[1] + (counts[t[0]] != null ? ' <span class="n">' + counts[t[0]] + '</span>' : '') + '</a>'; }).join('');
  $('#tabs').innerHTML = html;
  $('#drawer').innerHTML = '<div style="padding:8px 12px 14px;font-family:\'Mrs Saint Delafield\',cursive;font-size:40px;color:#B4532A">Mackenzie &amp; Brandon</div>' + html + '<a href="./" target="_blank" rel="noopener">' + ic('home') + 'Open the guest app</a>';
  $('#crumb').textContent = TABS.filter(function (t) { return t[0] === cur; })[0][1];
}
function drawer(open) { $('#drawer').classList.toggle('open', open); $('#drawerBg').classList.toggle('open', open); }
$('#menuBtn').addEventListener('click', function () { drawer(true); });
$('#drawerBg').addEventListener('click', function () { drawer(false); });
$('#drawer').addEventListener('click', function (e) { if (e.target.closest('a')) drawer(false); });
function route() {
  var h = location.hash.replace('#', '') || 'overview';
  if (!TABS.some(function (t) { return t[0] === h; })) h = 'overview';
  nav(h); $('#main').innerHTML = '<p class="muted">Loading...</p>'; $('#side').innerHTML = '';
  ({ overview: overview, rsvps: rsvps, guests: guests, photos: photos, wishes: wishes, gifts: gifts, quiz: quiz, settings: settings })[h]();
}
function side(html) { $('#side').innerHTML = html; }
function csv(rows) { return rows.map(function (r) { return r.map(function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\n'); }
function download(name, text) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name; a.click(); }

// ---------- data ----------
async function loadRsvp() {
  var p = await sb.from('parties').select('id,label,created_at');
  var g = await sb.from('guests').select('id,party_id,name,role,is_plus_one,sort');
  var a = await sb.from('rsvp_answers').select('guest_id,attending,plus_one_name,updated_at');
  var r = await sb.from('rsvps').select('party_id,submitted_by,song,note,submitted_at');
  var ans = {}; (a.data || []).forEach(function (x) { ans[x.guest_id] = x; });
  var res = {}; (r.data || []).forEach(function (x) { res[x.party_id] = x; });
  var parties = (p.data || []).map(function (pa) {
    var members = (g.data || []).filter(function (m) { return m.party_id === pa.id; }).sort(function (x, y) { return x.sort - y.sort; }).map(function (m) { return Object.assign({ ans: ans[m.id] }, m); });
    return { id: pa.id, label: pa.label, members: members, rsvp: res[pa.id] };
  }).sort(function (x, y) { return x.label.localeCompare(y.label); });
  var t = { invited: 0, yes: 0, no: 0, pending: 0, parties: parties.length, replied: 0 };
  parties.forEach(function (pa) { if (pa.rsvp) t.replied++; pa.members.forEach(function (m) { t.invited++; if (!m.ans) t.pending++; else if (m.ans.attending) t.yes++; else t.no++; }); });
  return { parties: parties, t: t };
}

// ---------- overview ----------
async function overview() {
  var R = await loadRsvp();
  var up = await sb.from('uploads').select('kind,hidden');
  var w = await sb.from('wishes').select('id', { count: 'exact', head: true });
  var gf = await sb.from('gifts').select('amount');
  var photos = (up.data || []).filter(function (x) { return x.kind === 'photo'; }).length, videos = (up.data || []).length - photos;
  var total = (gf.data || []).reduce(function (s, x) { return s + Number(x.amount); }, 0);
  counts.rsvps = R.t.replied + '/' + R.t.parties; counts.photos = (up.data || []).length; counts.wishes = w.count || 0; nav('overview');
  $('#main').innerHTML = '<h1>Hi, Mackenzie &amp; Brandon!</h1><p class="sub">Everything from your guests, in one place.</p>'
    + '<div class="stats">' + [[R.t.yes, 'Coming'], [R.t.no, 'Can\'t make it'], [R.t.pending, 'No reply yet'], [photos, 'Photos'], [videos, 'Videos'], [w.count || 0, 'Video wishes'], ['$' + total.toLocaleString(), 'Honeymoon gifts']].map(function (s) { return '<div class="stat"><b>' + s[0] + '</b><span>' + s[1] + '</span></div>'; }).join('') + '</div>'
    + '<div class="box"><h2>RSVP progress</h2><div style="height:12px;border-radius:6px;background:#F2ECE3;overflow:hidden;display:flex"><div style="width:' + pct(R.t.yes, R.t.invited) + '%;background:#1E6B42"></div><div style="width:' + pct(R.t.no, R.t.invited) + '%;background:#B4532A"></div></div><p class="muted" style="font-size:13px;margin:10px 0 0">' + R.t.replied + ' of ' + R.t.parties + ' invitations have replied. ' + R.t.yes + ' of ' + R.t.invited + ' invited guests are coming.</p></div>';
  side('<div class="box"><h2>Quick links</h2><div style="display:flex;flex-direction:column;gap:8px"><a class="btn light" href="#rsvps">See RSVPs</a><a class="btn light" href="#photos">Review photos</a><a class="btn light" href="./" target="_blank" rel="noopener">Open the guest app</a></div></div>');
}
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

// ---------- rsvps ----------
async function rsvps() {
  var R = await loadRsvp();
  function status(m) { return !m.ans ? '<span class="pill pend">No reply</span>' : m.ans.attending ? '<span class="pill yes">Coming</span>' : '<span class="pill no">Not coming</span>'; }
  $('#main').innerHTML = '<h1>RSVPs</h1><p class="sub">' + R.t.yes + ' coming, ' + R.t.no + ' not coming, ' + R.t.pending + ' waiting on a reply.</p>'
    + '<div class="row" style="margin-bottom:14px"><button class="btn" id="exp">Export to spreadsheet (CSV)</button><input class="in" id="flt" placeholder="Search a name" style="max-width:260px"></div>'
    + '<div class="tbl-wrap"><table><thead><tr><th>Invitation</th><th>Guest</th><th>Reply</th><th>Song request</th><th>Note</th></tr></thead><tbody id="rb">'
    + R.parties.map(function (p) { return p.members.map(function (m, i) {
      var nm = m.is_plus_one ? (m.ans && m.ans.plus_one_name ? esc(m.ans.plus_one_name) + ' <span class="muted">(plus one)</span>' : '<span class="muted">Plus one</span>') : esc(m.name);
      return '<tr data-s="' + esc((p.label + ' ' + m.name + ' ' + (m.ans ? m.ans.plus_one_name : '')).toLowerCase()) + '"><td>' + (i ? '' : '<b>' + esc(p.label) + '</b>') + '</td><td>' + nm + '<div class="muted" style="font-size:12px">' + esc(m.role) + '</div></td><td>' + status(m) + '</td><td>' + (i ? '' : esc(p.rsvp ? p.rsvp.song : '')) + '</td><td>' + (i ? '' : esc(p.rsvp ? p.rsvp.note : '')) + '</td></tr>';
    }).join(''); }).join('') + '</tbody></table></div>';
  $('#flt').addEventListener('input', function () { var q = this.value.toLowerCase().trim(); document.querySelectorAll('#rb tr').forEach(function (tr) { tr.style.display = !q || tr.getAttribute('data-s').indexOf(q) >= 0 ? '' : 'none'; }); });
  $('#exp').addEventListener('click', function () {
    var rows = [['Invitation', 'Name', 'Role', 'Plus one', 'Reply', 'Plus one name', 'Song', 'Note', 'Replied at']];
    R.parties.forEach(function (p) { p.members.forEach(function (m) { rows.push([p.label, m.name, m.role, m.is_plus_one ? 'yes' : '', !m.ans ? 'No reply' : m.ans.attending ? 'Coming' : 'Not coming', m.ans ? m.ans.plus_one_name : '', p.rsvp ? p.rsvp.song : '', p.rsvp ? p.rsvp.note : '', p.rsvp ? p.rsvp.submitted_at : '']); }); });
    download('rsvps.csv', csv(rows));
  });
  side('<div class="box"><h2>Headcount</h2><div class="stat" style="border:none;padding:0"><b>' + R.t.yes + '</b><span>guests coming, including plus ones</span></div></div>');
}

// ---------- guest list ----------
function parseCsv(text) {
  var rows = [], row = [], v = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { v += '"'; i++; } else if (c === '"') q = false; else v += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(v); v = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(v); rows.push(row); row = []; v = ''; } else v += c;
  }
  if (v || row.length) { row.push(v); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (x) { return x.trim(); }); });
}
function toParties(rows) {
  var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
  var iInv = head.indexOf('invitation'), iName = head.indexOf('name'), iRole = head.indexOf('role'), iPlus = head.indexOf('plus_one');
  if (iInv < 0 || iName < 0) throw new Error('The first row needs the column names: invitation, name, role, plus_one');
  var map = {}, order = [];
  rows.slice(1).forEach(function (r) {
    var inv = (r[iInv] || '').trim(), nm = (r[iName] || '').trim(); if (!inv || !nm) return;
    if (!map[inv]) { map[inv] = { label: inv, members: [] }; order.push(inv); }
    map[inv].members.push({ name: nm, role: iRole >= 0 ? (r[iRole] || '').trim() : '' });
    var plus = iPlus >= 0 ? (r[iPlus] || '').trim().toLowerCase() : '';
    if (plus === 'yes' || plus === 'y' || plus === 'true' || plus === '1') map[inv].members.push({ name: 'Plus one', role: 'Guest of ' + nm.split(' ')[0], plus: true });
  });
  return order.map(function (k) { return map[k]; });
}
async function guests() {
  var R = await loadRsvp();
  counts.guests = R.t.invited; nav('guests');
  $('#main').innerHTML = '<h1>Guest list</h1><p class="sub">' + R.t.parties + ' invitations, ' + R.t.invited + ' people. Guests can only RSVP for the people on their invitation.</p>'
    + '<div class="box" style="margin-bottom:18px"><h2>Add guests from a spreadsheet</h2><p class="muted" style="font-size:14px;margin-top:0">Save your spreadsheet as CSV with these columns: <b>invitation, name, role, plus_one</b>. Everyone with the same invitation name is grouped together. Put <b>yes</b> under plus_one to give that person a plus one.</p>'
    + '<input type="file" id="csvFile" accept=".csv,text/csv"><label class="f" for="csvText">Or paste it here</label><textarea id="csvText" class="in" placeholder="invitation,name,role,plus_one&#10;Jake\'s family,Jake Meyers,Brother of the bride,&#10;Jake\'s family,Lily Meyers,Daughter,&#10;Kayla Smith,Kayla Smith,Friend of the bride,yes"></textarea>'
    + '<div class="row" style="margin-top:12px"><button class="btn" id="prev">Preview</button><button class="btn accent" id="add" disabled>Add these invitations</button></div><div id="pv" style="margin-top:14px"></div></div>'
    + '<div class="tbl-wrap"><table><thead><tr><th>Invitation</th><th>People</th><th></th></tr></thead><tbody>'
    + R.parties.map(function (p) { return '<tr><td><b>' + esc(p.label) + '</b></td><td>' + p.members.map(function (m) { return esc(m.is_plus_one ? 'Plus one' : m.name) + (m.role ? ' <span class="muted">(' + esc(m.role) + ')</span>' : ''); }).join('<br>') + '</td><td><button class="btn light del" data-id="' + p.id + '" style="height:32px">Remove</button></td></tr>'; }).join('') + '</tbody></table></div>';
  var parsed = null;
  $('#csvFile').addEventListener('change', function () { var f = this.files[0]; if (!f) return; f.text().then(function (t) { $('#csvText').value = t; }); });
  $('#prev').addEventListener('click', function () {
    try { parsed = toParties(parseCsv($('#csvText').value)); } catch (e) { $('#pv').textContent = e.message; $('#add').disabled = true; return; }
    var dupes = parsed.filter(function (p) { return R.parties.some(function (x) { return x.label.toLowerCase() === p.label.toLowerCase(); }); });
    $('#pv').innerHTML = '<b>' + parsed.length + ' invitations, ' + parsed.reduce(function (s, p) { return s + p.members.length; }, 0) + ' people.</b>' + (dupes.length ? ' <span style="color:#8A3B1A">' + dupes.length + ' already exist and will be skipped: ' + dupes.map(function (d) { return esc(d.label); }).join(', ') + '</span>' : '');
    parsed = parsed.filter(function (p) { return dupes.indexOf(p) < 0; });
    $('#add').disabled = !parsed.length;
  });
  $('#add').addEventListener('click', async function () {
    this.disabled = true;
    for (var i = 0; i < parsed.length; i++) {
      var p = parsed[i];
      var ins = await sb.from('parties').insert({ label: p.label }).select('id').single();
      if (ins.error) { toast('Stopped: ' + ins.error.message); return; }
      var g = await sb.from('guests').insert(p.members.map(function (m, j) { return { party_id: ins.data.id, name: m.name, role: m.role || '', is_plus_one: !!m.plus, sort: j }; }));
      if (g.error) { toast('Stopped: ' + g.error.message); return; }
    }
    toast('Guest list updated'); guests();
  });
  document.querySelectorAll('.del').forEach(function (b) { b.addEventListener('click', function () {
    if (!confirm('Remove this invitation and any RSVP from it?')) return;
    sb.from('parties').delete().eq('id', b.getAttribute('data-id')).then(function (r) { if (r.error) toast(r.error.message); else guests(); });
  }); });
  side('<div class="box"><h2>Tip</h2><p class="muted" style="font-size:14px;margin:0">Use the name each guest would type. If someone goes by a nickname, list them that way, for example "Jake Meyers" instead of "Jacob Meyers".</p></div>');
}

// ---------- photos ----------
async function photos() {
  var r = await sb.from('uploads').select('*').order('created_at', { ascending: false }).limit(2000);
  var list = r.data || [];
  function url(p) { return p ? sb.storage.from('media').getPublicUrl(p).data.publicUrl : ''; }
  var show = 'all';
  function draw() {
    var items = list.filter(function (x) { return show === 'all' || (show === 'hidden' ? x.hidden : x.kind === show); });
    $('#main').innerHTML = '<h1>Photos &amp; videos</h1><p class="sub">' + list.length + ' shared. Hide anything you do not want guests to see. Hidden items stay saved for you.</p>'
      + '<div class="row" style="margin-bottom:14px">' + [['all', 'All'], ['photo', 'Photos'], ['video', 'Videos'], ['hidden', 'Hidden']].map(function (f) { return '<button class="btn ' + (show === f[0] ? '' : 'light') + ' flt" data-f="' + f[0] + '">' + f[1] + '</button>'; }).join('') + '</div>'
      + (items.length ? '<div class="grid">' + items.map(function (x) {
        return '<div class="ph' + (x.hidden ? ' hidden' : '') + '"><a href="' + esc(url(x.path)) + '" target="_blank" rel="noopener"><img src="' + esc(url(x.thumb_path || x.path)) + '" alt="" loading="lazy"></a>' + (x.kind === 'video' ? '<span class="tag">Video</span>' : '') + (x.mission != null ? '<span class="tag" style="left:auto;right:8px">Hunt</span>' : '') + '<div class="bar"><span>' + esc(x.guest_name || 'Guest') + '</span><button data-id="' + x.id + '" class="hide">' + (x.hidden ? 'Show' : 'Hide') + '</button></div></div>';
      }).join('') + '</div>' : '<p class="muted">Nothing here yet.</p>');
    document.querySelectorAll('.flt').forEach(function (b) { b.onclick = function () { show = b.getAttribute('data-f'); draw(); }; });
    document.querySelectorAll('.hide').forEach(function (b) { b.onclick = function () {
      var x = list.filter(function (i) { return i.id === b.getAttribute('data-id'); })[0];
      sb.from('uploads').update({ hidden: !x.hidden }).eq('id', x.id).then(function (res) { if (res.error) return toast(res.error.message); x.hidden = !x.hidden; draw(); });
    }; });
  }
  draw();
  side('<div class="box"><h2>Keeping everything</h2><p class="muted" style="font-size:14px;margin:0">Tap any photo to open the full size and save it. To download everything at once after the wedding, Codember will run the download script and hand you a folder of every photo and video.</p></div>');
}

// ---------- wishes ----------
async function wishes() {
  var r = await sb.from('wishes').select('*').order('created_at', { ascending: false });
  var list = r.data || [];
  var signed = {};
  if (list.length) {
    var s = await sb.storage.from('wishes').createSignedUrls(list.map(function (w) { return w.path; }), 60 * 60 * 6);
    (s.data || []).forEach(function (x) { signed[x.path] = x.signedUrl; });
  }
  var capOpen = {};
  function draw() {
    $('#main').innerHTML = '<h1>Video wishes</h1><p class="sub">' + list.length + ' messages. Time capsule videos stay sealed until your anniversary.</p>'
      + (list.length ? list.map(function (w) {
        var sealed = w.capsule && !capOpen[w.id];
        return '<div class="wish">' + (sealed ? '<div style="width:100%;aspect-ratio:9/12;max-width:200px;border-radius:12px;background:#3B2A1E;color:#F6E2C8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center"><b>Time capsule</b><span style="font-size:12px">Sealed until your first anniversary</span><button class="btn light open" data-id="' + w.id + '" style="height:32px">Open early</button></div>' : '<video controls playsinline preload="metadata" src="' + esc(signed[w.path] || '') + '"></video>')
          + '<div><b style="font-size:16px">' + esc(w.guest_name || 'A guest') + '</b><div class="muted" style="font-size:13px;margin:4px 0 8px">' + esc(w.prompt) + ' · ' + new Date(w.created_at).toLocaleString() + '</div>' + (signed[w.path] && !sealed ? '<a href="' + esc(signed[w.path]) + '" target="_blank" rel="noopener">Open or save</a>' : '') + '</div></div>';
      }).join('') : '<p class="muted">No video wishes yet.</p>');
    document.querySelectorAll('.open').forEach(function (b) { b.onclick = function () { if (confirm('Open this time capsule now?')) { capOpen[b.getAttribute('data-id')] = 1; draw(); } }; });
  }
  draw();
}

// ---------- gifts ----------
async function gifts() {
  var r = await sb.from('gifts').select('*').order('created_at', { ascending: false });
  var list = r.data || [], total = list.reduce(function (s, x) { return s + Number(x.amount); }, 0);
  $('#main').innerHTML = '<h1>Honeymoon fund</h1><p class="sub">Guests who tapped Venmo or Cash App. Check your Venmo and Cash App to confirm each payment came through.</p>'
    + '<div class="tbl-wrap"><table><thead><tr><th>From</th><th>Amount</th><th>For</th><th>Note</th><th>App</th><th>When</th></tr></thead><tbody>'
    + (list.length ? list.map(function (g) { return '<tr><td><b>' + esc(g.guest_name || 'Guest') + '</b></td><td>$' + Number(g.amount).toLocaleString() + '</td><td>' + esc(g.what) + '</td><td>' + esc(g.note) + '</td><td>' + esc(g.method) + '</td><td>' + new Date(g.created_at).toLocaleDateString() + '</td></tr>'; }).join('') : '<tr><td colspan="6" class="muted">No gifts yet.</td></tr>')
    + '</tbody></table></div>';
  side('<div class="box"><div class="stat" style="border:none;padding:0"><b>$' + total.toLocaleString() + '</b><span>pledged by ' + list.length + ' guests</span></div><button class="btn light" id="gexp" style="margin-top:12px">Export for thank-you notes</button></div>');
  $('#gexp').onclick = function () { download('honeymoon-gifts.csv', csv([['From', 'Amount', 'For', 'Note', 'App', 'When']].concat(list.map(function (g) { return [g.guest_name, g.amount, g.what, g.note, g.method, g.created_at]; })))); };
}

// ---------- quiz ----------
async function quiz() {
  var Q = C.quiz || [];
  var k = await sb.from('quiz_key').select('*');
  var saved = {}; (k.data || []).forEach(function (x) { saved[x.q_index] = x.correct; });
  var inSync = Q.length && Q.every(function (q, i) { return saved[i] === q.correct; }) && Object.keys(saved).length === Q.length;
  var lb = await sb.rpc('quiz_leaderboard');
  $('#main').innerHTML = '<h1>Couple quiz</h1><p class="sub">' + Q.length + ' questions. The right answers come from config.js.</p>'
    + '<div class="box" style="margin-bottom:18px">' + Q.map(function (q, i) { return '<div style="padding:8px 0;border-bottom:1px solid #F0EAE1"><b>' + (i + 1) + '. ' + esc(q.q) + '</b><div class="muted" style="font-size:14px;margin-top:4px">Answer: ' + esc(q.o[q.correct]) + '</div></div>'; }).join('')
    + '<div class="row" style="margin-top:14px"><button class="btn accent" id="saveKey">' + (inSync ? 'Answer key is saved' : 'Save answer key') + '</button></div></div>'
    + '<h2>Leaderboard</h2>' + ((lb.data || []).length ? '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Guest</th><th>Score</th></tr></thead><tbody>' + lb.data.map(function (r, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(r.name || 'Guest') + '</td><td>' + r.score + ' / ' + Q.length + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="muted">No answers yet.</p>');
  $('#saveKey').onclick = async function () {
    await sb.from('quiz_key').delete().gte('q_index', 0);
    var r = await sb.from('quiz_key').insert(Q.map(function (q, i) { return { q_index: i, correct: q.correct }; }));
    if (r.error) toast(r.error.message); else { toast('Answer key saved'); quiz(); }
  };
}

// ---------- settings ----------
function toLocalInput(iso) { if (!iso) return ''; var d = new Date(iso); if (isNaN(d)) return ''; d = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); }
async function settings() {
  var r = await sb.from('settings').select('*');
  var s = {}; (r.data || []).forEach(function (x) { s[x.key] = x.value; });
  var unlocked = Date.now() >= Date.parse(s.unlock_at || '2999-01-01');
  $('#main').innerHTML = '<h1>Settings</h1><p class="sub">Times use your phone\'s time zone.</p>'
    + '<div class="box"><label class="f" for="unl">Photos, gallery and scavenger hunt open at</label><input type="datetime-local" class="in" id="unl" value="' + toLocalInput(s.unlock_at) + '">'
    + '<label class="f" for="rev">Quiz leaderboard shows at</label><input type="datetime-local" class="in" id="rev" value="' + toLocalInput(s.quiz_reveal_at) + '">'
    + '<div class="row" style="margin-top:16px"><button class="btn accent" id="saveS">Save</button><button class="btn light" id="openNow">' + (unlocked ? 'Photos are open' : 'Open photos right now') + '</button></div>'
    + '<p class="muted" style="font-size:13px;margin-bottom:0">Right now photo sharing is <b>' + (unlocked ? 'open' : 'locked') + '</b>.</p></div>';
  function save(vals) {
    return sb.from('settings').upsert(Object.keys(vals).map(function (k) { return { key: k, value: vals[k] }; })).then(function (res) { if (res.error) toast(res.error.message); else { toast('Saved'); settings(); } });
  }
  $('#saveS').onclick = function () {
    var u = $('#unl').value, q = $('#rev').value; var v = {};
    if (u) v.unlock_at = new Date(u).toISOString(); if (q) v.quiz_reveal_at = new Date(q).toISOString();
    save(v);
  };
  $('#openNow').onclick = function () { if (!unlocked && confirm('Open photo sharing for all guests right now?')) save({ unlock_at: new Date(Date.now() - 60000).toISOString() }); };
}
})();
</script>
